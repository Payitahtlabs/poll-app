<h2 class="survey-question__title">
  <span class="survey-question__number">{{ question().position }}.</span>
  <span class="user-text">{{ question().text }}</span>
</h2>
@if (question().allow_multiple) {
  <p class="survey-question__hint">More than one answer is possible.</p>
}
<ul class="survey-question__answers" role="list">
  @for (option of question().answer_options; track option.id) {
    <li>
      <label class="survey-question__answer">
        <input
          class="survey-question__input"
          [type]="inputType()"
          [name]="groupName()"
          [checked]="isSelected(option.id)"
          [disabled]="isLocked()"
          (change)="answerToggled.emit(option.id)"
        />
        <span class="survey-question__box">
          <img
            class="survey-question__check"
            src="./assets/images/checkbox-check.svg"
            alt=""
            width="10"
            height="8"
          />
        </span>
        <span class="survey-question__label">
          <span class="survey-question__letter">{{ option.position | answerLetter }}.</span>
          <span class="user-text">{{ option.text }}</span>
        </span>
      </label>
    </li>
  }
</ul>
