<header class="header">
  <a class="header__home-link" routerLink="/">
    <img
      class="header__logo header__logo--light"
      src="./assets/images/logo.svg"
      alt="PollApp"
      width="119"
      height="50"
    />
    <img
      class="header__logo header__logo--dark"
      src="./assets/images/logo-dark.svg"
      alt="PollApp"
      width="119"
      height="50"
    />
  </a>
  <button
    class="button-primary header__create"
    type="button"
    [class.header__create--hidden]="isDialogOpen()"
    (click)="openDialog()"
  >
    <span class="button-primary__label">
      Create survey
      <img
        class="button-primary__icon"
        src="./assets/images/add-circle.svg"
        alt=""
        width="24"
        height="24"
      />
    </span>
  </button>
</header>
