<article class="highlight-card">
  <p class="highlight-card__category">{{ survey().category }}</p>
  <h4 class="highlight-card__title user-text">
    <a class="highlight-card__link" [routerLink]="['/survey', survey().id]">{{ survey().title }}</a>
  </h4>
  <p class="highlight-card__deadline">{{ survey().end_date | deadlineLabel }}</p>
</article>
